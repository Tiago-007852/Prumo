  <circle cx="32" cy="21" r="4.6" fill="none" stroke="#2A2008" stroke-width="2.6"/>

  <!-- Massa do prumo (fio de prumo de pedreiro) -->
  <path d="M32 25.6C40.5 25.6 45 31.4 45 37.8C45 45.6 38.8 52.4 32 57.6C25.2 52.4 19 45.6 19 37.8C19 31.4 23.5 25.6 32 25.6Z" fill="#2A2008"/>
