<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Prumo">
  <defs>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#F6DC8A"/>
      <stop offset="1" stop-color="#E3B93C"/>
    </linearGradient>
  </defs>

  <!-- Chip dourado — mesma arte do cabeçalho da landing (.logo) -->
